<svg width="900" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f2ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="domeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bff6ff"/>
      <stop offset="100%" stop-color="#4fd8ff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4a5a"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
  </defs>

  <!-- stars twinkle -->
  <circle cx="60" cy="30" r="1.6" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="100" r="1.3" fill="#ffffff" opacity="0.6">
    <animate attributeName="opacity" values="1;0.2;1" dur="3.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="20" r="1.4" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="110" r="1.5" fill="#ffffff" opacity="0.5">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="35" r="1.3" fill="#ffffff" opacity="0.7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- flying ufo group, moves along a wavy path -->
  <g id="ufoGroup">
    <!-- glow -->
    <ellipse cx="0" cy="6" rx="46" ry="20" fill="url(#glow)"/>
    <!-- tractor beam -->
    <polygon points="-16,14 16,14 34,46 -34,46" fill="#00f2ff" opacity="0.16">
      <animate attributeName="opacity" values="0.08;0.22;0.08" dur="1.6s" repeatCount="indefinite"/>
    </polygon>
    <!-- dome -->
    <ellipse cx="0" cy="-6" rx="16" ry="12" fill="url(#domeGrad)" stroke="#eafcff" stroke-width="0.5"/>
    <!-- body -->
    <ellipse cx="0" cy="6" rx="42" ry="12" fill="url(#bodyGrad)" stroke="#00f2ff" stroke-width="1"/>
    <!-- lights -->
    <circle cx="-24" cy="8" r="2.4" fill="#ff5da2">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-8" cy="10" r="2.4" fill="#ffe45e">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="8" cy="10" r="2.4" fill="#5eff8f">
      <animate attributeName="opacity" values="1;0.15;1" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="8" r="2.4" fill="#00f2ff">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="0.9s" begin="0.9s" repeatCount="indefinite"/>
    </circle>

    <animateMotion dur="7s" repeatCount="indefinite"
      path="M -80 90 C 60 20, 180 150, 320 70 S 560 -10, 700 60 S 900 120, 980 40" />
  </g>
</svg>
